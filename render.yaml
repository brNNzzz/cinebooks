# "Blueprint" do Render: descreve a aplicação inteira (site + banco de dados)
# num arquivo só. Quando você conecta o repositório no Render e ele encontra
# este arquivo, oferece pra criar tudo automaticamente com um clique.
services:
  - type: web
    name: cinebooks
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn cinebooks.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: cinebooks-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Chave gratuita do TMDB para buscar capas de filmes/séries
      # automaticamente. sync: false = o Render NÃO define um valor sozinho;
      # você preenche manualmente no painel (aba Environment do serviço),
      # depois de criar sua chave em themoviedb.org (veja o README).
      - key: TMDB_API_KEY
        sync: false

databases:
  - name: cinebooks-db
    plan: free
